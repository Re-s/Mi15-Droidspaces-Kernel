name: Build Mi15 Droidspaces Kernel

# Xiaomi 15 (dada, sm8750) - GKI android15-6.6 / KMI android15-8 / 4K pages
# Stock reference: 6.6.118-android15-8-gb9cc6ec16bc8-abogki536571621-4k

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: "GKI source tag (sublevel). 118 = matches stock exactly"
        type: choice
        options:
          - android15-6.6-2026-01_r1   # 6.6.118  <- stock
          - android15-6.6-2026-04_r1   # 6.6.127
          - android15-6.6-2026-07_r1   # 6.6.139
        default: android15-6.6-2026-01_r1
      root_flavor:
        description: "Root solution"
        type: choice
        options:
          - ksu-next     # KernelSU-Next (hooks built in, no KPM)
          - sukisu       # SukiSU Ultra (supports KPM)
          - none         # no root, Droidspaces only
        default: ksu-next
      ksu_ref:
        description: "Root tag/commit to pin (blank = latest tag)"
        type: string
        default: ""
      use_susfs:
        description: "SUSFS root hiding"
        type: boolean
        default: true
      use_kpm:
        description: "KPM (SukiSU Ultra only; ignored for ksu-next)"
        type: boolean
        default: false
      use_droidspaces:
        description: "Droidspaces container support (kABI patch + configs)"
        type: boolean
        default: true
      kernel_name:
        description: "Kernel name, replaces kleaf's -maybe-dirty placeholder"
        type: string
        default: "-Mi15-DS"
      formats:
        description: "Artifact formats (comma list: bootimg,anykernel,image)"
        type: string
        default: "bootimg,anykernel,image"
      make_release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-22.04 ships ~29GB free; a kleaf GKI tree + bazel cache needs ~50GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            cpio pahole libncurses-dev rsync curl zip unzip tar xz-utils gcc g++ gawk openssl

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >>"$GITHUB_PATH"

      - name: Resolve manifest branch
        id: res
        run: |
          TAG='${{ inputs.kernel_tag }}'
          # android15-6.6-2026-01_r1 -> common-android15-6.6-2026-01
          MB="common-$(echo "$TAG" | sed -E 's/_r[0-9]+$//')"
          echo "manifest_branch=$MB" >>"$GITHUB_OUTPUT"
          echo "Manifest branch: $MB   tag: $TAG"
          # Effective root revision, for cache keying. Must match apply-root.sh's default.
          REF='${{ inputs.ksu_ref }}'
          FLAVOR='${{ inputs.root_flavor }}'
          if [ "$FLAVOR" = "ksu-next" ] && [ '${{ inputs.use_susfs }}' = "true" ]; then
            FLAVOR=sukisu   # apply-root.sh redirects this combination
          fi
          [ -n "$REF" ] || { [ "$FLAVOR" = "sukisu" ] && REF=6c5603f0 || REF=latest; }
          echo "root_key=${FLAVOR}-${REF}" >>"$GITHUB_OUTPUT"
          echo "Root cache key: ${FLAVOR}-${REF}"

      # ---------------------------------------------------------------- caches
      # Three caches, each invalidated only by its own pinned input:
      #   git mirror  -> manifest branch + source tag (the ~1GB of repo objects)
      #   root+susfs  -> resolved root revision
      #   bazel       -> everything that affects codegen
      #
      # restore/save are split deliberately. actions/cache saves only when the job
      # SUCCEEDS, and the builds that most need a warm cache are the ones that just
      # failed. The save steps below run with `if: always()`, so a failed compile still
      # leaves the downloaded sources (and any partial bazel output) for the next run.
      - name: Restore git mirror
        id: cache_git
        uses: actions/cache/restore@v4
        with:
          path: ~/gki-mirror
          key: gitmirror-${{ steps.res.outputs.manifest_branch }}-${{ inputs.kernel_tag }}
          restore-keys: |
            gitmirror-${{ steps.res.outputs.manifest_branch }}-

      - name: Restore root sources
        id: cache_root
        uses: actions/cache/restore@v4
        with:
          path: ~/root-src
          key: rootsrc-${{ steps.res.outputs.root_key }}-susfs${{ inputs.use_susfs }}-${{ github.run_id }}
          restore-keys: |
            rootsrc-${{ steps.res.outputs.root_key }}-susfs${{ inputs.use_susfs }}-

      - name: Restore bazel cache
        id: cache_bazel
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          # Every input that changes generated code belongs in this key, otherwise a
          # stale object could be reused across differing configurations.
          key: >-
            bazel-${{ inputs.kernel_tag }}-${{ steps.res.outputs.root_key }}-ds${{ inputs.use_droidspaces }}-susfs${{ inputs.use_susfs }}-kpm${{ inputs.use_kpm }}-${{ hashFiles('scripts/*.sh', 'patches/droidspaces/*') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ inputs.kernel_tag }}-${{ steps.res.outputs.root_key }}-ds${{ inputs.use_droidspaces }}-susfs${{ inputs.use_susfs }}-kpm${{ inputs.use_kpm }}-${{ hashFiles('scripts/*.sh', 'patches/droidspaces/*') }}-
            bazel-${{ inputs.kernel_tag }}-${{ steps.res.outputs.root_key }}-ds${{ inputs.use_droidspaces }}-susfs${{ inputs.use_susfs }}-kpm${{ inputs.use_kpm }}-
            bazel-${{ inputs.kernel_tag }}-${{ steps.res.outputs.root_key }}-

      - name: Sync GKI source (pinned)
        run: |
          set -eux
          mkdir -p ~/gki && cd ~/gki
          # --reference against a cached mirror: repo hardlinks objects from it instead
          # of refetching ~1GB. --dissociate keeps the worktree independent of the
          # mirror afterwards, so a cache miss on a later run cannot corrupt the tree.
          #
          # Strip extensions.preciousObjects from the mirror first: repo sets it to
          # protect its shared object stores, but it makes git refuse to delete packs
          # during --dissociate ("cannot delete packs in a precious-objects repo"),
          # which killed run 34045892578. The mirror is a disposable cache - unsetting
          # is safe. If init still fails, fall back to a full fetch so a corrupt mirror
          # can never block a build.
          REFARG=""
          if [ -d ~/gki-mirror/.repo ]; then
            echo "git mirror cache HIT ($(du -sh ~/gki-mirror | cut -f1))"
            find ~/gki-mirror/.repo -name config -type f | while read -r f; do
              git config --file "$f" --unset-all extensions.preciousObjects 2>/dev/null || true
            done
            REFARG="--reference=$HOME/gki-mirror --dissociate"
          else
            echo "git mirror cache MISS - full fetch"
          fi
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b '${{ steps.res.outputs.manifest_branch }}' $REFARG \
            || { echo "::warning::repo init with mirror failed; retrying with a full fetch";
                 rm -rf ~/gki/.repo
                 repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
                     -b '${{ steps.res.outputs.manifest_branch }}'; }
          # Belt and braces: pin kernel/common to the exact tag regardless of what
          # the monthly manifest points at. Tracking a branch HEAD would let
          # vermagic/CRCs drift away from the vendor modules -> bootloop.
          mkdir -p .repo/local_manifests
          cat >.repo/local_manifests/pin.xml <<LM
          <manifest>
            <remove-project name="kernel/common" />
            <project path="common" name="kernel/common" revision="refs/tags/${{ inputs.kernel_tag }}" />
          </manifest>
          LM
          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --optimized-fetch --prune
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' common/Makefile | head -3
          du -sh ~/gki

      # Refresh the mirror from the tree we just synced, so the next run can hardlink
      # from it. Done as a bare mirror of .repo (that is where repo keeps the objects).
      - name: Seed git mirror cache
        run: |
          set -eu
          if [ ! -d ~/gki-mirror/.repo ]; then
            mkdir -p ~/gki-mirror
            cp -al ~/gki/.repo ~/gki-mirror/.repo 2>/dev/null \
              || cp -a ~/gki/.repo ~/gki-mirror/.repo
            # Do not cache preciousObjects: it makes repo init --reference
            # --dissociate fail on the next run (pack deletion is refused).
            find ~/gki-mirror/.repo -name config -type f | while read -r f; do
              git config --file "$f" --unset-all extensions.preciousObjects 2>/dev/null || true
            done
            echo "mirror seeded: $(du -sh ~/gki-mirror | cut -f1)"
          else
            echo "mirror already present, leaving as-is"
          fi

      - name: Apply Droidspaces
        if: ${{ inputs.use_droidspaces }}
        run: ./scripts/apply-droidspaces.sh ~/gki/common

      - name: Apply root solution
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
          USE_SUSFS: ${{ inputs.use_susfs }}
          USE_KPM: ${{ inputs.use_kpm }}
          KSU_REF: ${{ inputs.ksu_ref }}
          # Must resolve to the same directory as the ~/root-src cache path above.
          SRC_CACHE: /home/runner/root-src
        run: ./scripts/apply-root.sh ~/gki

      - name: Align config with stock environment
        run: ./scripts/fix-gki-config.sh ~/gki '${{ inputs.kernel_name }}'

      # kernel_aarch64 comes from define_common_kernels(target_configs = {...}), not a
      # literal kernel_build(name = "kernel_aarch64"), so this needs a real parser
      # rather than a sed that silently matches nothing.
      - name: Prepare bazel target
        run: python3 ./scripts/patch-bazel-target.py ~/gki/common/BUILD.bazel

      - name: Build kernel
        run: |
          set -euxo pipefail
          cd ~/gki
          # build/build.sh no longer exists on android15-6.6 manifests; kleaf only.
          # NB: `pipefail` is essential. Piping bazel into `tail` without it yields
          # tail's exit status, so a failed build reports success and the real error
          # only surfaces later as a confusing "built Image not found".
          # --disk_cache must point at the cached directory, or the cache does nothing.
          # This is what turns a repeat build from ~18 min into a few minutes.
          tools/bazel build --config=fast \
            --disk_cache="$HOME/.cache/bazel-disk" \
            //common:kernel_aarch64/Image 2>&1 | tail -80
          echo "bazel disk cache: $(du -sh "$HOME/.cache/bazel-disk" 2>/dev/null | cut -f1 || echo n/a)"

      - name: Verify build
        id: verify
        env:
          # Use the EFFECTIVE values exported by apply-root.sh, not the raw inputs:
          # ksu-next + SUSFS is redirected to sukisu, so gating on inputs.root_flavor
          # would assert against a flavor that was never built.
          ROOT_FLAVOR: ${{ env.EFFECTIVE_ROOT_FLAVOR || inputs.root_flavor }}
          USE_KPM: ${{ env.EFFECTIVE_USE_KPM || inputs.use_kpm }}
          USE_SUSFS: ${{ inputs.use_susfs }}
          USE_DROIDSPACES: ${{ inputs.use_droidspaces }}
        run: ./scripts/verify-build.sh ~/gki

      - name: Package artifacts
        env:
          IMAGE: ${{ steps.verify.outputs.image }}
          OUTDIR: ${{ github.workspace }}/artifacts
          FORMATS: ${{ inputs.formats }}
          KERNEL_NAME: Mi15-Droidspaces
          ROOT_FLAVOR: ${{ env.EFFECTIVE_ROOT_FLAVOR || inputs.root_flavor }}
          # Reuse the cached AnyKernel3 clone instead of refetching it every run.
          SRC_CACHE: /home/runner/root-src
        run: ./scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mi15-${{ env.EFFECTIVE_ROOT_FLAVOR || inputs.root_flavor }}-${{ steps.verify.outputs.kver }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      # All saves run with if: always() - a failed compile is exactly when the next run
      # most needs these already downloaded.
      #
      # The git mirror is immutable for a given tag, so it is written once: skip the
      # save when the exact key was already restored. The other two get refreshed every
      # run and therefore use run-unique keys (see the note on the bazel save).
      - name: Save git mirror
        if: always() && steps.cache_git.outputs.cache-matched-key != format('gitmirror-{0}-{1}', steps.res.outputs.manifest_branch, inputs.kernel_tag)
        uses: actions/cache/save@v4
        with:
          path: ~/gki-mirror
          key: gitmirror-${{ steps.res.outputs.manifest_branch }}-${{ inputs.kernel_tag }}

      - name: Save root sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/root-src
          key: rootsrc-${{ steps.res.outputs.root_key }}-susfs${{ inputs.use_susfs }}-${{ github.run_id }}

      # The save key carries a run-unique suffix. A cache key can only be written once,
      # so reusing the restore key would make every later save a no-op — the disk cache
      # would freeze at whatever the first run produced. The restore step finds these
      # by prefix via restore-keys, which resolves to the most recent match.
      - name: Save bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: >-
            bazel-${{ inputs.kernel_tag }}-${{ steps.res.outputs.root_key }}-ds${{ inputs.use_droidspaces }}-susfs${{ inputs.use_susfs }}-kpm${{ inputs.use_kpm }}-${{ hashFiles('scripts/*.sh', 'patches/droidspaces/*') }}-${{ github.run_id }}

      # Run-unique keys accumulate, and a repo only gets 10GB of cache before GitHub
      # starts evicting by LRU - which could evict the git mirror we want to keep.
      # Prune our own older entries instead, newest two per prefix retained.
      - name: Prune old caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for prefix in \
            "bazel-${{ inputs.kernel_tag }}-${{ steps.res.outputs.root_key }}-" \
            "rootsrc-${{ steps.res.outputs.root_key }}-" ; do
            gh cache list --repo '${{ github.repository }}' --key "$prefix" \
                --limit 100 --sort created_at --order desc \
                --json id,key,sizeInBytes --jq '.[].id' 2>/dev/null \
              | tail -n +3 \
              | while read -r id; do
                  [ -n "$id" ] || continue
                  gh cache delete "$id" --repo '${{ github.repository }}' >/dev/null 2>&1 \
                    && echo "  deleted cache $id" || true
                done
          done
          echo "remaining caches:"
          gh cache list --repo '${{ github.repository }}' --limit 30 \
            --json key,sizeInBytes --jq '.[] | "  \(.sizeInBytes/1048576|floor)MB  \(.key)"' 2>/dev/null || true

      - name: Publish release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.kver }}-${{ github.run_number }}
          name: Mi15 Droidspaces ${{ steps.verify.outputs.kver }}
          body: |
            **Xiaomi 15 (dada)** GKI kernel — Droidspaces + root

            | | |
            |---|---|
            | Kernel | `${{ steps.verify.outputs.kver }}` |
            | Source tag | `${{ inputs.kernel_tag }}` |
            | Root | `${{ env.EFFECTIVE_ROOT_FLAVOR || inputs.root_flavor }}` (ref: `${{ inputs.ksu_ref || 'latest' }}`) |
            | SUSFS | `${{ inputs.use_susfs }}` |
            | KPM | `${{ inputs.use_kpm }}` |
            | Droidspaces | `${{ inputs.use_droidspaces }}` |

            Flash `boot.img`:
            ```
            fastboot flash boot boot.img
            ```
            Keep your stock boot.img — if it does not boot, flash the backup back.
          files: artifacts/*
